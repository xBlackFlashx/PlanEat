# Despliegue de la demo estática en GitHub Pages.
#
# La demo no tiene backend: el motor de generación corre en el navegador
# (packages/motor, portado desde services/solver). Por eso Pages basta y por eso
# el build es un `next build` con `output: "export"`.
#
# El solver Python sigue siendo la fuente de verdad del algoritmo. Sus tests
# corren aquí también: si el motor Python y el portado se separan, esto se pone
# en rojo antes de publicar nada.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un despliegue a la vez. `cancel-in-progress: false` porque cancelar a mitad de
# una publicación deja el sitio en un estado indeterminado.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar el solver de referencia
        working-directory: services/solver
        run: pip install -e ".[dev]"

      - name: Tests del solver de referencia
        working-directory: services/solver
        run: pytest -q

      # El volcado de paridad pesa ~7 MB y está fuera del repositorio, así que en
      # un clon limpio los 14 tests que lo consumen se SALTAN. Regenerarlo aquí
      # es lo que hace que la comparación TS↔Python se ejecute de verdad en CI;
      # sin este paso, `npm test` pasaría en verde sin haber comprobado la
      # paridad, que es la única garantía de que el port no ha derivado.
      - name: Regenerar el volcado de paridad
        working-directory: services/solver
        run: python scripts/volcar_paridad.py

      - name: Tests del motor portado
        run: npm test

  construir:
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # El catálogo se compila a JSON columnar en build: el navegador no lee del
      # disco. Se recompila aquí en vez de confiar en el fichero versionado, para
      # que un catálogo editado sin recompilar no llegue a producción.
      - name: Compilar catálogo
        run: npm run motor:catalogo

      - name: Build estático
        run: npm run build
        env:
          # El sitio se sirve bajo /PlanEat, no en la raíz del dominio.
          PLANEAT_BASE_PATH: /PlanEat

      # Sin esto, GitHub Pages pasa el directorio por Jekyll y descarta todo lo
      # que empieza por guion bajo — que es donde Next.js pone sus assets.
      - name: Desactivar Jekyll
        run: touch apps/web/out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
