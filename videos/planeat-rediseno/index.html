<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="33"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-cover"
        class="scene"
        data-composition-id="01-cover"
        data-composition-src="compositions/frames/01-cover.html"
        data-start="0"
        data-duration="3.4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-portada"
        class="scene"
        data-composition-id="02-portada"
        data-composition-src="compositions/frames/02-portada.html"
        data-start="3"
        data-duration="6.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-dia-real"
        class="scene"
        data-composition-id="03-dia-real"
        data-composition-src="compositions/frames/03-dia-real.html"
        data-start="9"
        data-duration="6.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-plan-cuadra"
        class="scene"
        data-composition-id="04-plan-cuadra"
        data-composition-src="compositions/frames/04-plan-cuadra.html"
        data-start="15"
        data-duration="7.4"
        data-track-index="1"
      ></div>

      <div
        id="el-05-sistema"
        class="scene"
        data-composition-id="05-sistema"
        data-composition-src="compositions/frames/05-sistema.html"
        data-start="22"
        data-duration="7.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-outro"
        class="scene"
        data-composition-id="06-outro"
        data-composition-src="compositions/frames/06-outro.html"
        data-start="29"
        data-duration="4"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-cover", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 3);
        tl.fromTo("#el-02-portada", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 3);
        tl.to("#el-02-portada", { x: 1920, duration: 0.5, ease: "power3.inOut" }, 9);
        tl.fromTo("#el-03-dia-real", { x: -1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 9);
        tl.to("#el-03-dia-real", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 15);
        tl.fromTo("#el-04-plan-cuadra", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 15);
        tl.to("#el-04-plan-cuadra", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 22);
        tl.fromTo("#el-05-sistema", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 22);
        tl.to("#el-05-sistema", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 29);
        tl.fromTo("#el-06-outro", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 29);
        tl.to({}, { duration: 33 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
