# Declarado explícitamente en vez de confiar en el defecto de pip: sin esto, un
# pip antiguo se niega a instalar en modo editable ("editable mode currently
# requires a setuptools-based build") y el mensaje no dice qué falta.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planeat-solver"
version = "0.1.0"
description = "Motor de generación de planes de comida bajo restricciones"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "numpy>=2.1",
  "highspy>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "httpx>=0.27"]

# El paquete es `app` y sólo `app`. Sin esta declaración, setuptools intenta
# adivinarlo recorriendo el directorio y se planta en cuanto hay más de una
# carpeta de primer nivel: `data/` (catálogo, fixtures y volcados de paridad) y
# `scripts/` son datos y herramientas, no paquetes instalables, pero la
# autodetección no puede saberlo y aborta con "Multiple top-level packages
# discovered in a flat-layout" en vez de elegir por su cuenta.
#
# El fallo no aparecía en un entorno ya creado —el paquete estaba instalado de
# antes de que `data/` creciera— y sí en una instalación limpia, que es
# exactamente lo que hace CI.
[tool.setuptools]
packages = ["app", "app.solver"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# La raíz del servicio, en el path de importación de los tests.
#
# `scripts/` es un paquete de verdad (tiene `__init__.py`) y dos tests de
# catálogo importan de él las constantes con las que se construyó el catálogo
# —los grupos de ingredientes animales y el umbral de bajo en carbohidratos—,
# que es justamente lo que hace que el test compruebe algo: si las copiara,
# comprobaría su propia copia.
#
# Pero es herramienta de construcción, no del servicio, así que no entra en
# `[tool.setuptools] packages`. Antes se importaba de rebote, porque la
# instalación editable sin `packages` declarado dejaba la raíz entera en el
# path; al declararlo, dejó de estar y estos dos tests fallaron sólo en CI.
pythonpath = ["."]
