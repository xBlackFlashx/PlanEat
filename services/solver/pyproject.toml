[project]
name = "planeat-solver"
version = "0.1.0"
description = "Motor de generación de planes de comida bajo restricciones"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "numpy>=2.1",
  "highspy>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "httpx>=0.27"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
